name: Deploy S-Agentic University Agent

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

jobs:
  deploy-temporary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy temporary Cloudflare Worker
        run: npx wrangler deploy --temporary | tee cloudflare-deploy.log
      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deploy-log
          path: cloudflare-deploy.log
